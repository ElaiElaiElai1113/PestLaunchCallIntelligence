    if(!kind||!host) return;
    const key=host.dataset.direction,s=states[key],cursor=input.selectionStart;
    s[kind]=input.value;render(key);
    const replacement=host.querySelector(`[data-input="${kind}"]`);
    replacement?.focus();if(replacement?.setSelectionRange&&cursor!==null) replacement.setSelectionRange(cursor,cursor);
    save();
  });
  restore(window.openai?.widgetState);renderAll();
  window.addEventListener('openai:set_globals',event=>{const prior=updatedAt;restore(event.detail?.globals?.widgetState);if(updatedAt!==prior) renderAll();});
  if(typeof Tweak!=='undefined') for(const key of Object.keys(states)) {
    const host=root.querySelector(`[data-direction="${key}"]`);
    new Tweak({container:host,onChange:()=>{render(key);save();}}).addToggle(states[key],'compact',{label:'Compact checkpoint spacing'});
  }
})();
</script>
